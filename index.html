<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Puzzle Cam Pro - Ultimate Edition</title>
<style>
  :root {
    --primary: #FFD60A;
    --success: #00FF88;
    --bg: #050505;
    --panel: rgba(18, 18, 18, 0.85);
    --border: rgba(255, 255, 255, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
  
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  video#webcam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  canvas#canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }

  /* شاشة الترحيب أو البداية */
  #overlayScreen {
    position: absolute; inset: 0; background: rgba(5,5,5,0.85); backdrop-filter: blur(12px);
    z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    transition: opacity 0.4s ease;
  }
  #overlayScreen.hidden { opacity: 0; pointer-events: none; }
  .logo-icon { font-size: 64px; margin-bottom: 15px; animation: float 2s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  
  h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; background: linear-gradient(45deg, #FFD60A, #ff9f0a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p.desc { color: #aaa; max-width: 500px; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }

  /* لوحة المعلومات العلوية */
  .hud-panel {
    position: absolute; top: 16px; background: var(--panel); backdrop-filter: blur(8px);
    padding: 10px 16px; border-radius: 14px; font-size: 12px; border: 1px solid var(--border);
    z-index: 10; display: flex; gap: 15px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #topLeft { left: 16px; font-weight: 600; color: #ddd; max-width: 280px; line-height: 1.5; }
  #status { right: 16px; direction: ltr; text-align: left; }
  #status b { color: var(--primary); }

  /* لوحة التحكم السفلية */
  #controls {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10; background: var(--panel); backdrop-filter: blur(8px);
    padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .btn {
    background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 12px;
    cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.2); border-color: var(--primary); transform: translateY(-1px); }
  .btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
  .btn.primary { background: var(--success); color: #000; border: none; }

  /* العداد المركزي الكبير */
  #count {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 140px; font-weight: 900; color: var(--primary); z-index: 20;
    text-shadow: 0 0 40px rgba(0,0,0,0.9); pointer-events: none;
  }
</style>

<!-- استدعاء المكتبات الرسمية -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>

<div id="wrap">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="count"></div>

  <!-- شاشة الترحيب والبدء -->
  <div id="overlayScreen">
    <div class="logo-icon">🧩</div>
    <h1>Puzzle Cam Pro</h1>
    <p class="desc">لعبة بازل ذكية تعمل بالكامل عبر إيماءات اليد باستخدام الذكاء الاصطناعي.<br>تحكم بالإطار، التقط صورتك، وركب القطع بسلاسة تامة.</p>
    <button class="btn primary" id="startBtn" style="padding: 14px 32px; font-size: 15px;">بدء التجربة 🚀</button>
  </div>

  <!-- الـ HUD العلوي -->
  <div id="topLeft" class="hud-panel">
    <span id="instructionText">👋 استخدم يديك الاثنتين لتحديد حجم الإطار</span>
  </div>

  <div id="status" class="hud-panel">
    <div>FPS: <b id="sFps">60</b></div>
    <div>TIME: <b id="sTimer">00:00</b></div>
    <div>MOVES: <b id="sMoves">0</b></div>
  </div>

  <!-- شريط التحكم السفلي -->
  <div id="controls">
    <button class="btn diff-btn" data-grid="2">2×2</button>
    <button class="btn diff-btn active" data-grid="3">3×3</button>
    <button class="btn diff-btn" data-grid="4">4×4</button>
    <button class="btn" id="mirrorBtn">↔ انعكاس</button>
    <button class="btn" id="resetBtn">🔄 إعادة ضبط</button>
  </div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const countEl = document.getElementById('count');
const instructionText = document.getElementById('instructionText');
const overlayScreen = document.getElementById('overlayScreen');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// إعدادات اللعبة والمتغيرات
let GRID = 3;
let isMirroredState = false;
let isCaptured = false;
let capturedImg = null;
let tiles = [], selected = null;
let correctCount = 0;
let movesCount = 0;
let gameTimer = 0;
let timerInterval = null;
let customFrame = { x: canvas.width/2 - 200, y: canvas.height/2 - 200, w: 400, h: 400 };
let isDefiningFrame = false;

// نظام الصوت المتقدم عبر Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  const now = audioCtx.currentTime;
  if (type === 'snap') {
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'tick') {
    osc.frequency.setValueAtTime(500, now);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'win') {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(f, now + i * 0.1);
      g.gain.setValueAtTime(0.2, now + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
      o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.3);
    });
  }
}

// زر بدء التشغيل
document.getElementById('startBtn').onclick = () => {
  overlayScreen.classList.add('hidden');
  initCamera();
};

// أزرار التحكم
document.getElementById('mirrorBtn').onclick = () => {
  isMirroredState = !isMirroredState;
  video.style.transform = isMirroredState ? 'scaleX(-1)' : 'none';
};

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    GRID = parseInt(btn.dataset.grid);
    if (isCaptured && capturedImg) initTiles();
  };
});

document.getElementById('resetBtn').onclick = resetGame;

function resetGame() {
  isCaptured = false;
  capturedImg = null;
  tiles = [];
  selected = null;
  correctCount = 0;
  movesCount = 0;
  gameTimer = 0;
  clearInterval(timerInterval);
  document.getElementById('sTimer').textContent = "00:00";
  document.getElementById('sMoves').textContent = "0";
  window.counting = false;
  instructionText.textContent = "👋 استخدم يديك الاثنتين لتحديد حجم الإطار";
}

// عداد الوقت
function startTimer() {
  gameTimer = 0;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    gameTimer++;
    let m = Math.floor(gameTimer / 60).toString().padStart(2, '0');
    let s = (gameTimer % 60).toString().padStart(2, '0');
    document.getElementById('sTimer').textContent = `${m}:${s}`;
  }, 1000);
}

// حساب الأصابع
function countFingers(lm) {
  let c = 0;
  if (lm[8].y < lm[6].y) c++;
  if (lm[12].y < lm[10].y) c++;
  if (lm[16].y < lm[14].y) c++;
  if (lm[20].y < lm[18].y) c++;
  if (Math.abs(lm[4].x - lm[3].x) > 0.03) c++;
  return c;
}

// إعداد MediaPipe Hands
const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.75,
  minTrackingConfidence: 0.75
});

hands.onResults(res => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.save();
  if (isMirroredState) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  let totalFingers = 0, handCount = 0, currentGrabs = [];

  if (res.multiHandLandmarks) {
    handCount = res.multiHandLandmarks.length;
    for (let i = 0; i < handCount; i++) {
      const lm = res.multiHandLandmarks[i];
      totalFingers += countFingers(lm);
      
      drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: 'rgba(255,255,255,0.4)', lineWidth: 2 });
      drawLandmarks(ctx, lm, { color: '#FFD60A', lineWidth: 1, radius: 4 });

      // تتبع القرص بدقة (Pinch Detection)
      const thumb = lm[4], index = lm[8], wrist = lm[0], middleBase = lm[9];
      const palmSize = Math.hypot(wrist.x - middleBase.x, wrist.y - middleBase.y);
      const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
      const pinchRatio = pinchDist / palmSize;

      if (pinchRatio < 0.35) {
        let hx = index.x * canvas.width;
        let hy = index.y * canvas.height;
        if (!isMirroredState) hx = canvas.width - hx;
        
        currentGrabs.push({ x: hx, y: hy, handIndex: i });

        // رسم دائرة القرص التفاعلية
        ctx.beginPath();
        ctx.arc(hx, hy, 24, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 214, 10, 0.85)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.stroke();
      }
    }
  }

  // --- معالجة الإطار والالتقاط ---
  if (!isCaptured) {
    if (currentGrabs.length === 2) {
      isDefiningFrame = true;
      const x1 = currentGrabs[0].x, y1 = currentGrabs[0].y;
      const x2 = currentGrabs[1].x, y2 = currentGrabs[1].y;
      customFrame.x = Math.min(x1, x2);
      customFrame.y = Math.min(y1, y2);
      let size = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
      size = Math.min(Math.max(size, 200), Math.min(canvas.width, canvas.height) * 0.7);
      customFrame.w = size; customFrame.h = size;
      instructionText.textContent = "📐 يتم ضبط الإطار... اترك يديك للتثبيت";
    } else if (currentGrabs.length === 0 && isDefiningFrame) {
      isDefiningFrame = false;
      instructionText.textContent = "✌️ تم التثبيت! ارفع إصبعين لالتقاط الصورة";
    }

    // رسم الإطار التوجيهي
    ctx.strokeStyle = '#FFD60A';
    ctx.lineWidth = 4;
    ctx.strokeRect(customFrame.x, customFrame.y, customFrame.w, customFrame.h);
    ctx.fillStyle = 'rgba(255, 214, 10, 0.08)';
    ctx.fillRect(customFrame.x, customFrame.y, customFrame.w, customFrame.h);

    if (handCount > 0 && totalFingers >= 2 && !window.counting && !isDefiningFrame && currentGrabs.length === 0) {
      startCountdown();
    }
  } else {
    // --- مرحلة اللعب وتتبع القطع بنعومة تامة (Lerp Physics) ---
    if (currentGrabs.length > 0) {
      if (!selected) {
        for (let grab of currentGrabs) {
          for (let t of [...tiles].reverse()) {
            if (!t.done && grab.x > t.x && grab.x < t.x + t.w && grab.y > t.y && grab.y < t.y + t.h) {
              selected = t;
              selected.grabHand = grab.handIndex;
              movesCount++;
              document.getElementById('sMoves').textContent = movesCount;
              break;
            }
          }
          if (selected) break;
        }
      }
      if (selected) {
        let myGrab = currentGrabs.find(g => g.handIndex === selected.grabHand) || currentGrabs[0];
        if (myGrab) {
          // Linear Interpolation لجعل الحركة ناعمة بدون اهتزاز
          let targetX = myGrab.x - selected.w / 2;
          let targetY = myGrab.y - selected.h / 2;
          selected.x += (targetX - selected.x) * 0.35;
          selected.y += (targetY - selected.y) * 0.35;
        }
      }
    } else if (selected) {
      checkSnap(selected);
      selected = null;
    }

    if (capturedImg) {
      const fw = customFrame.x, fh = customFrame.y;
      
      ctx.strokeStyle = 'rgba(255, 214, 10, 0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(fw, fh, customFrame.w, customFrame.h);

      tiles.forEach(t => {
        if (t === selected) return;
        if (t.done) {
          ctx.drawImage(capturedImg, t.sx, t.sy, t.sw, t.sh, t.ox, t.oy, t.w, t.h);
          ctx.strokeStyle = '#00FF88'; ctx.lineWidth = 2;
          ctx.strokeRect(t.ox, t.oy, t.w, t.h);
        } else {
          ctx.drawImage(capturedImg, t.sx, t.sy, t.sw, t.sh, t.x, t.y, t.w, t.h);
          ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
          ctx.strokeRect(t.x, t.y, t.w, t.h);
        }
      });

      if (selected) {
        ctx.drawImage(capturedImg, selected.sx, selected.sy, selected.sw, selected.sh, selected.x, selected.y, selected.w, selected.h);
        ctx.strokeStyle = '#FFD60A'; ctx.lineWidth = 4;
        ctx.strokeRect(selected.x, selected.y, selected.w, selected.h);
      }
    }
  }
});

async function startCountdown() {
  if (isCaptured || window.counting) return;
  window.counting = true;
  instructionText.textContent = "📸 استعد... جارِ الالتقاط";

  for (let i = 3; i >= 1; i--) {
    countEl.textContent = i;
    playSound('tick');
    await new Promise(r => setTimeout(r, 700));
  }
  countEl.textContent = '';

  const sizeW = customFrame.w, sizeH = customFrame.h;
  const tmp = document.createElement('canvas');
  tmp.width = sizeW; tmp.height = sizeH;
  const tctx = tmp.getContext('2d');

  const tempV = document.createElement('canvas');
  tempV.width = canvas.width; tempV.height = canvas.height;
  const tvCtx = tempV.getContext('2d');

  if (isMirroredState) { tvCtx.translate(canvas.width, 0); tvCtx.scale(-1, 1); }
  tvCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
  tctx.drawImage(tempV, customFrame.x, customFrame.y, sizeW, sizeH, 0, 0, sizeW, sizeH);

  capturedImg = tmp;
  initTiles();
  isCaptured = true;
  window.counting = false;
  startTimer();
  instructionText.textContent = "🧩 اقرص القطع ورتبها في مكانها الصحيح";
}

function initTiles() {
  const fw = customFrame.x, fh = customFrame.y, size = customFrame.w;
  const tw = size / GRID, th = size / GRID;
  let pos = [];
  for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) pos.push({ r, c });
  pos.sort(() => Math.random() - 0.5);

  tiles = [];
  let k = 0;
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const p = pos[k++];
      tiles.push({
        sx: c * capturedImg.width / GRID, sy: r * capturedImg.height / GRID,
        sw: capturedImg.width / GRID, sh: capturedImg.height / GRID,
        x: fw + p.c * tw, y: fh + p.r * th,
        w: tw, h: th,
        ox: fw + c * tw, oy: fh + r * th,
        done: false
      });
    }
  }
  correctCount = 0;
}

function checkSnap(t) {
  const threshold = (customFrame.w / GRID) * 0.35;
  const dist = Math.hypot(t.x - t.ox, t.y - t.oy);
  if (dist < threshold) {
    t.x = t.ox; t.y = t.oy;
    t.done = true;
    correctCount++;
    playSound('snap');

    if (correctCount === GRID * GRID) {
      clearInterval(timerInterval);
      playSound('win');
      confetti({ particleCount: 300, spread: 120, origin: { y: 0.6 } });
      instructionText.textContent = "🏆 مبروك! أكملت البازل بنجاح تام";
    }
  }
}

function initCamera() {
  const cameraObj = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 1280,
    height: 720
  });
  cameraObj.start();
}
</script>
</body>
</html>
