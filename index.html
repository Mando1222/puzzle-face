<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PuzzleFace PRO - Mobile + Desktop</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#FFD60A;--bg:#0B0B0F;--card:#15151C;--border:#24242E}
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}
body{background:radial-gradient(1200px at 50% -10%,#1a1a28 0%,var(--bg) 60%);color:#fff;font-family:'Cairo',sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border)}
.logo{font-weight:800} .logo span{color:var(--accent)}
.stats{display:flex;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px}
.stat{background:var(--card);border:1px solid var(--border);padding:6px 10px;border-radius:999px} .stat b{color:var(--accent)}
main{flex:1;display:grid;grid-template-columns:1.2fr .8fr;gap:20px;padding:16px;max-width:1400px;margin:0 auto;width:100%}
@media(max-width:900px){main{grid-template-columns:1fr} .camera-wrap{aspect-ratio:3/4 !important}}
.camera-wrap{position:relative;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;aspect-ratio:4/3}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.scan-line{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:300px;border:2px solid var(--accent);border-radius:16px;pointer-events:none;box-shadow:0 0 0 4000px rgba(0,0,0,.35) inset}
@media(max-width:600px){.scan-line{width:260px;height:260px}}
.count{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:800;color:var(--accent);pointer-events:none}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
.btn{width:100%;background:var(--accent);color:#000;font-weight:800;font-size:16px;padding:14px;border:none;border-radius:12px;cursor:pointer}
.levels{display:flex;gap:8px} .level{flex:1;padding:10px;border-radius:10px;background:#0f0f14;border:1px solid var(--border);cursor:pointer;text-align:center;font-size:13px} .level.active{background:var(--accent);color:#000;font-weight:700}
.win{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99} .win.show{display:flex} .win-box{background:#16161e;border:1px solid #2a2a36;border-radius:24px;padding:32px;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
<header><div class="logo">PUZZLE<span>FACE</span> PRO</div><div class="stats"><div class="stat">TIME: <b id="time">00:00</b></div><div class="stat">MOVES: <b id="moves">0</b></div></div></header>
<main>
<div class="camera-wrap" id="wrap"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="scan-line" id="scan"></div><div class="count" id="count"></div></div>
<div class="side">
<div class="card"><div class="levels"><div class="level active" data-n="3">3x3 سهل</div><div class="level" data-n="4">4x4 متوسط</div><div class="level" data-n="5">5x5 صعب</div></div></div>
<button class="btn" id="startBtn">▶ ابدأ 3-2-1</button>
<button class="btn" id="saveBtn" style="background:#222;color:#fff;display:none">📥 حفظ الصورة</button>
<div class="card"><div style="color:#9aa0b2;font-size:13px">التحكم: <b id="handStatus" style="color:var(--accent)">جاهز</b><br>لابتوب: Pinch بالايد | موبايل: لمس واسحب</div></div>
</div>
</main>
<div class="win" id="winModal"><div class="win-box"><h2>¡COMPLETADO!</h2><p id="final" style="margin:12px 0;color:#9aa0b2"></p><button class="btn" onclick="location.reload()">العب تاني</button></div></div>
<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const countEl=document.getElementById('count'), scan=document.getElementById('scan'), timeEl=document.getElementById('time'), movesEl=document.getElementById('moves'), handStatus=document.getElementById('handStatus'), startBtn=document.getElementById('startBtn'), saveBtn=document.getElementById('saveBtn');
canvas.width=640; canvas.height=480;
let GRID=3, tiles=[], captured=null, selected=null, isCaptured=false, moves=0, timer=null, seconds=0;
document.querySelectorAll('.level').forEach(l=>{l.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('active')); l.classList.add('active'); GRID=parseInt(l.dataset.n); if(isCaptured) initTiles();}});
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.6,minTrackingConfidence:0.5});
hands.onResults(onResults);
const cameraObj=new Camera(video,{onFrame:async()=>{await hands.send({image:video});},width:640,height:480}); cameraObj.start();

function onResults(res){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!isCaptured) return;
  tiles.forEach(t=>{if(t===selected) return; ctx.drawImage(captured,t.sx,t.sy,t.sw,t.sh,t.x,t.y,t.w,t.h); ctx.strokeStyle=t.correct?'#00FF88':'rgba(255,255,255,.2)'; ctx.lineWidth=t.correct?2:1; ctx.strokeRect(t.x,t.y,t.w,t.h);});
  if(res.multiHandLandmarks && res.multiHandLandmarks.length>0){
    handStatus.textContent=`ايد متشافة - اعمل Pinch`;
    for(const lm of res.multiHandLandmarks){
      const thumb=lm[4], index=lm[8]; const dist=Math.hypot(thumb.x-index.x, thumb.y-index.y); const pinching=dist<0.05;
      const hx=(1-index.x)*canvas.width; const hy=index.y*canvas.height;
      if(pinching){
        if(!selected){for(let i=tiles.length-1;i>=0;i--){const t=tiles[i]; if(hx>t.x&&hx<t.x+t.w&&hy>t.y&&hy<t.y+t.h){selected=t; break;}}}
        else{selected.x=hx-selected.w/2; selected.y=hy-selected.h/2;}
        ctx.beginPath(); ctx.arc(hx,hy,18,0,Math.PI*2); ctx.fillStyle='rgba(255,214,10,.8)'; ctx.fill();
      }else if(selected){snapSelected();}
      if(selected){ctx.drawImage(captured,selected.sx,selected.sy,selected.sw,selected.sh,selected.x,selected.y,selected.w,selected.h); ctx.strokeStyle='#FFD60A'; ctx.lineWidth=3; ctx.strokeRect(selected.x,selected.y,selected.w,selected.h);}
    }
  }
}
function snapSelected(){
  if(!selected) return;
  const d=Math.hypot(selected.x-selected.ox, selected.y-selected.oy);
  if(d<35){selected.x=selected.ox; selected.y=selected.oy; if(!selected.correct){selected.correct=true; moves++; movesEl.textContent=moves;}}
  selected=null; checkWin();
}
function initTiles(){
  const size=Math.min(300, canvas.width*0.7); const sx=(canvas.width-size)/2, sy=(canvas.height-size)/2; const tileW=size/GRID, tileH=size/GRID;
  const imgW=captured.width, imgH=captured.height; tiles=[]; let pos=[]; for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) pos.push({r,c}); pos.sort(()=>Math.random()-.5); let k=0;
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){const p=pos[k++]; tiles.push({sx:c*imgW/GRID, sy:r*imgH/GRID, sw:imgW/GRID, sh:imgH/GRID, x:sx+p.c*tileW, y:sy+p.r*tileH, w:tileW, h:tileH, ox:sx+c*tileW, oy:sy+r*tileH, correct:false});}
  moves=0; movesEl.textContent='0'; seconds=0; clearInterval(timer); timer=setInterval(()=>{seconds++; timeEl.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000);
}
function checkWin(){if(tiles.length>0 && tiles.every(t=>t.correct)){clearInterval(timer); confetti({particleCount:220,spread:90,origin:{y:.6}}); document.getElementById('final').textContent=`خلصتها في ${timeEl.textContent} بـ ${moves} حركة`; document.getElementById('winModal').classList.add('show'); saveBtn.style.display='block';}}
async function doCapture(){for(let i=3;i>0;i--){countEl.textContent=i; await new Promise(r=>setTimeout(r,700));} countEl.textContent=''; scan.style.display='none'; const size=300; const tmp=document.createElement('canvas'); tmp.width=size; tmp.height=size; const tctx=tmp.getContext('2d'); tctx.translate(size,0); tctx.scale(-1,1); tctx.drawImage(video,0,0,640,480,0,0,size,size); captured=tmp; isCaptured=true; initTiles(); startBtn.textContent='↻ إعادة';}
startBtn.onclick=doCapture;
saveBtn.onclick=()=>{const out=document.createElement('canvas'); out.width=300; out.height=300; const octx=out.getContext('2d'); tiles.forEach(t=>{octx.drawImage(captured,t.sx,t.sy,t.sw,t.sh,t.ox,t.oy,t.w,t.h);}); const a=document.createElement('a'); a.download=`puzzle-${Date.now()}.png`; a.href=out.toDataURL(); a.click();};

// --- MOBILE TOUCH ---
let touchTile=null;
function getTouchPos(touch){
  const rect=canvas.getBoundingClientRect();
  return {x:(touch.clientX-rect.left)*(canvas.width/rect.width), y:(touch.clientY-rect.top)*(canvas.height/rect.height)};
}
canvas.addEventListener('touchstart', e=>{
  if(!isCaptured) return; const p=getTouchPos(e.touches[0]);
  for(let i=tiles.length-1;i>=0;i--){const tl=tiles[i]; if(p.x>tl.x&&p.x<tl.x+tl.w&&p.y>tl.y&&p.y<tl.y+tl.h){touchTile=tl; selected=tl; break;}}
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault(); if(!touchTile) return; const p=getTouchPos(e.touches[0]); touchTile.x=p.x-touchTile.w/2; touchTile.y=p.y-touchTile.h/2;
},{passive:false});
canvas.addEventListener('touchend', e=>{
  if(!touchTile) return; const d=Math.hypot(touchTile.x-touchTile.ox, touchTile.y-touchTile.oy);
  if(d<35){touchTile.x=touchTile.ox; touchTile.y=touchTile.oy; if(!touchTile.correct){touchTile.correct=true; moves++; movesEl.textContent=moves;}}
  touchTile=null; selected=null; checkWin();
});
</script>
</body>
</html>
